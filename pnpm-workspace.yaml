packages:
  - constants/**
  - domains/**
  - libraries/**
  - apps/**
  - utils/**
  - '!**/dist/**'
minimumReleaseAge: 0
verifyDepsBeforeRun: false
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
